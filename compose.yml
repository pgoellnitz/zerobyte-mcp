services:
  zerobyte-mcp:
    build: .
    env_file: .env
    expose:
      - "8000"
    ports:
      - 8000:8000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    #labels:
    #  - "docktail.enabled=true"
    #  - "docktail.name=zerobyte-mcp"
    #  - "docktail.port=8000"
